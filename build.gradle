android {
    namespace 'com.dsx.virtualkeyboard'
    compileSdk 33

    defaultConfig {
        applicationId "com.dsx.virtualkeyboard"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'app/src/main/AndroidManifest.xml'
            java.srcDirs = ['app/src/main/java']
            res.srcDirs = ['app/src/main/res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
